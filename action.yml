
name: "My First Custom Action"
description: "Displays a message and repository information"

inputs:
  message:
    description: "Message to display"
    required: false
    default: "Hello from my custom GitHub Action"

runs:
  using: "composite"
  steps:
    - name: Display message
      shell: bash
      env:
        CUSTOM_MESSAGE: ${{ inputs.message }}
        REPOSITORY_NAME: ${{ github.repository }}
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        echo "$CUSTOM_MESSAGE"
        echo "Repository: $REPOSITORY_NAME"
        echo "Branch: $BRANCH_NAME"
